```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Pay</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef4ff;
    color:#222;
}

/* LOGIN */
.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1261ff,#00b894);
}

.login-box{
    width:360px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

.logo{
    font-size:35px;
    font-weight:bold;
    color:#1261ff;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#1261ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0649d8;
}

/* MAIN */
#app{
    display:none;
}

header{
    background:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

header h1{
    color:#1261ff;
}

.logout{
    width:auto;
    padding:10px 18px;
    margin:0;
    background:#ff4757;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

/* BALANCE */
.balance-card{
    background:linear-gradient(135deg,#1261ff,#00b894);
    color:white;
    padding:30px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.balance-card p{
    font-size:16px;
}

.balance-card h2{
    font-size:38px;
    margin-top:10px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
    color:#1261ff;
    margin-bottom:15px;
}

/* CONTACTS */
.contact{
    padding:12px;
    background:#f5f7fb;
    margin:8px 0;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.contact button{
    width:auto;
    padding:7px 12px;
    margin:0;
}

/* HISTORY */
.history{
    margin-top:25px;
    background:white;
    padding:25px;
    border-radius:18px;
}

.transaction{
    padding:15px 5px;
    border-bottom:1px solid #ddd;
    display:flex;
    justify-content:space-between;
}

.credit{
    color:#00a86b;
}

.debit{
    color:#e84118;
}

.message{
    margin-top:12px;
    font-weight:bold;
    text-align:center;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="logo">💳 Money Pay</div>

        <div class="subtitle">
            Simple & Secure Payment Demo
        </div>

        <input
            type="tel"
            id="mobileNumber"
            placeholder="Enter Mobile Number"
            maxlength="10"
        >

        <input
            type="password"
            id="pin"
            placeholder="Enter 4 Digit PIN"
            maxlength="4"
        >

        <button onclick="login()">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

        <small>
            Demo Login: Any 10 digit mobile + 4 digit PIN
        </small>

    </div>

</div>


<!-- ================= MAIN APP ================= -->

<div id="app">

<header>

    <h1>💳 Money Pay</h1>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <!-- BALANCE -->

    <div class="balance-card">

        <p>Available Balance</p>

        <h2 id="balance">
            ₹10,000
        </h2>

        <p id="userMobile">
            Mobile: -
        </p>

    </div>


    <div class="cards">

        <!-- TRANSFER -->

        <div class="card">

            <h2>💸 Money Transfer</h2>

            <input
                type="text"
                id="receiver"
                placeholder="Mobile / Account Number"
            >

            <input
                type="number"
                id="amount"
                placeholder="Enter Amount"
            >

            <select id="transferType">

                <option value="contact">
                    Contact Number
                </option>

                <option value="bank">
                    Bank Account
                </option>

            </select>

            <button onclick="transferMoney()">
                Send Money
            </button>

            <p id="transferMessage" class="message"></p>

        </div>


        <!-- CONTACTS -->

        <div class="card">

            <h2>👥 Contacts</h2>

            <div class="contact">

                <span>Rahul</span>

                <button onclick="selectContact('9876543210')">
                    Pay
                </button>

            </div>

            <div class="contact">

                <span>Priya</span>

                <button onclick="selectContact('9876501234')">
                    Pay
                </button>

            </div>

            <div class="contact">

                <span>Arun</span>

                <button onclick="selectContact('9123456780')">
                    Pay
                </button>

            </div>

        </div>

    </div>


    <!-- TRANSACTION HISTORY -->

    <div class="history">

        <h2>📜 Transaction History</h2>

        <div id="historyList">

            <p>No transactions yet.</p>

        </div>

    </div>

</div>


<footer>

    © 2026 Money Pay | Student Demo Project

</footer>

</div>


<script>

/* =========================================
   DEMO DATA
========================================= */

let balance = 10000;

let transactions = [];

let currentUser = "";


/* =========================================
   FUNCTION 1 - LOGIN
========================================= */

function login(){

    let mobile =
        document.getElementById("mobileNumber").value;

    let pin =
        document.getElementById("pin").value;

    let message =
        document.getElementById("loginMessage");

    if(mobile.length !== 10){

        message.innerText =
            "❌ Please enter a valid 10 digit mobile number.";

        message.style.color = "red";

        return;
    }

    if(pin.length !== 4){

        message.innerText =
            "❌ PIN must contain 4 digits.";

        message.style.color = "red";

        return;
    }

    currentUser = mobile;

    document.getElementById("loginPage").style.display =
        "none";

    document.getElementById("app").style.display =
        "block";

    document.getElementById("userMobile").innerText =
        "Mobile: " + mobile;

    updateBalance();

}


/* =========================================
   FUNCTION 2 - MONEY TRANSFER
========================================= */

function transferMoney(){

    let receiver =
        document.getElementById("receiver").value;

    let amount =
        Number(document.getElementById("amount").value);

    let type =
        document.getElementById("transferType").value;

    let message =
        document.getElementById("transferMessage");


    if(receiver === ""){

        message.innerText =
            "❌ Enter mobile/account number.";

        message.style.color = "red";

        return;
    }


    if(amount <= 0){

        message.innerText =
            "❌ Enter a valid amount.";

        message.style.color = "red";

        return;
    }


    if(amount > balance){

        message.innerText =
            "❌ Insufficient balance.";

        message.style.color = "red";

        return;
    }


    /* Deduct money */

    balance -= amount;


    /* Add transaction */

    let transaction = {

        receiver: receiver,

        amount: amount,

        type: type,

        date: new Date().toLocaleString()

    };


    transactions.unshift(transaction);


    updateBalance();

    showHistory();


    message.innerText =
        "✅ ₹" + amount +
        " transferred successfully!";

    message.style.color = "green";


    document.getElementById("receiver").value = "";

    document.getElementById("amount").value = "";

}


/* =========================================
   BALANCE UPDATE
========================================= */

function updateBalance(){

    document.getElementById("balance").innerText =
        "₹" + balance.toLocaleString("en-IN");

}


/* =========================================
   CONTACT PAY BUTTON
========================================= */

function selectContact(number){

    document.getElementById("receiver").value =
        number;

    document.getElementById("receiver").scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================================
   TRANSACTION HISTORY
========================================= */

function showHistory(){

    let history =
        document.getElementById("historyList");

    if(transactions.length === 0){

        history.innerHTML =
            "<p>No transactions yet.</p>";

        return;
    }


    history.innerHTML = "";


    transactions.forEach(function(transaction){

        history.innerHTML += `

            <div class="transaction">

                <div>

                    <strong>
                        💸 Money Sent
                    </strong>

                    <br>

                    <small>
                        To: ${transaction.receiver}
                    </small>

                    <br>

                    <small>
                        ${transaction.date}
                    </small>

                </div>

                <strong class="debit">

                    - ₹${transaction.amount}

                </strong>

            </div>

        `;

    });

}


/* =========================================
   FUNCTION 3 - LOGOUT
========================================= */

function logout(){

    document.getElementById("app").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "flex";

    document.getElementById("mobileNumber").value =
        "";

    document.getElementById("pin").value =
        "";

}


/* =========================================
   INITIAL HISTORY
========================================= */

showHistory();

</script>

</body>
</html>
```
